name: Build Windows EXE

on:
  # 手动触发（推荐）
  workflow_dispatch:

  # 可选：推送 main 分支时自动构建
  # push:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-socketio requests pandas numpy pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name OKX_Swing_Scanner okx_swing.py
      - name: Create distribution folder
        run: |
          mkdir dist\OKX_Swing_Scanner
          copy dist\OKX_Swing_Scanner.exe dist\OKX_Swing_Scanner\
          echo Double-click to run. Visit http://localhost:5000 in your browser. > dist\OKX_Swing_Scanner\README.txt

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\OKX_Swing_Scanner -DestinationPath OKX_Swing_Scanner_Windows.zip

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKX_Swing_Scanner_Windows
          path: OKX_Swing_Scanner_Windows.zip
